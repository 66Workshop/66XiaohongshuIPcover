name: validate-ip-cover-skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository assets and structure
        run: python scripts/validate_repo.py

      - name: Validate Creative Content governance
        run: python scripts/validate_creative_governance.py

      - name: Validate all jobs
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            python scripts/validate_job.py "$file"
          done < <(find jobs -name '*.json' -print0)

      - name: Validate JSON syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
          done < <(find assets/manifests schemas jobs records governance tasks -name '*.json' -print0)
